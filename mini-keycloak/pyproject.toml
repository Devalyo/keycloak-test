[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-keycloak"
version = "0.1.0"
description = "Compact Python identity and OpenID Connect service"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.0,<5",
  "argon2-cffi>=23.1,<26",
  "PyJWT[crypto]>=2.10,<3",
  "gunicorn>=26.2,<27",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "setuptools>=75",
  "PyYAML>=6,<7",
]

[project.scripts]
mini-keycloak = "mini_keycloak.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_keycloak*"]

[tool.setuptools.package-data]
mini_keycloak = ["templates/*.html", "import_export/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires a live PostgreSQL 17 database via MINI_KEYCLOAK_TEST_POSTGRES_URL",
  "deployment: container contracts and live isolated Docker Compose acceptance",
]
